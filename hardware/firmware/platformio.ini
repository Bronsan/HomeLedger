; 入库扫描器固件骨架 —— PlatformIO / Arduino-ESP32
;
; 对应 docs/HARDWARE.md §2.1 的验证套件：
;   ESP32-S3-DevKitC-1 (N16R8) + OV2640 + ST7789 + 蜂鸣器/按键
;
; 用法：
;   pio run -t upload          # 编译并烧录
;   pio device monitor         # 串口日志 115200
;
; 注意：PSRAM 必须开。VGA 帧缓冲 + 解码中间缓冲一起约 1.2MB，
; 没开 PSRAM 会在 esp_camera_init 阶段就失败（日志：frame buffer malloc failed）。
;
; 屏幕可关：把 -DUSE_DISPLAY=1 去掉，固件仍能扫，只是没有「扫到了什么」这一行字。
; 验证阶段建议留着 —— 它是最快的调试窗口。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DUSE_DISPLAY=1

monitor_speed = 115200
upload_speed = 921600

; esp32-camera 用 Espressif 官方仓库；quirc 是纯 C 的 QR 解码器（约 30KB）。
; 条码（EAN-13 / Code128）不在骨架里 —— 需要 zbar 的 MCU 移植版，见文档 §6.2。
lib_deps =
    esp32-camera
    https://github.com/dlbeer/quirc.git#v1.2
