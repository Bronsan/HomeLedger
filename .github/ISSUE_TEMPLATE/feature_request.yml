name: 功能建议
description: 提出新功能、改进或使用场景
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        HomeLedger 是本地优先的家庭物品台账。提出建议前，请先看看 [README](https://github.com/Bronsan/HomeLedger#readme) 和 [docs/](https://github.com/Bronsan/HomeLedger/tree/main/docs) 里是否已有相关说明。
        新功能、数据模型变更和权限模型变更需要先讨论方案，避免做完才发现方向不一致。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述真实的使用场景，而不是只描述功能名称。
      placeholder: 例如：家里有大量同型号的耗材，想按批次记录开封日期和剩余数量。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 可以描述交互、数据字段、权限或部署方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在是怎么绕过去的？为什么不够好？

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 物品与分类
        - 位置与标签
        - 维护与保修
        - 借还与批次
        - 同步与备份
        - 权限与成员
        - 导入导出
        - 界面与可访问性
        - 部署与运维
        - 文档与站点
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue，没有找到相同建议。
          required: true
        - label: 这个建议不要求绕过许可证或商业授权限制。
          required: true
