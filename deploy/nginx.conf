# Nginx 反向代理示例
#
#   证书可用 certbot 申请：
#   certbot --nginx -d homeledger.example.com

upstream homeledger_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name homeledger.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name homeledger.example.com;

    ssl_certificate     /etc/letsencrypt/live/homeledger.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homeledger.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 隐私：不写访问日志（默认格式含客户端 IP）。
    access_log off;

    # 与 HOMELEDGER_MAX_UPLOAD_MB 保持一致
    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 800;

    location / {
        proxy_pass http://homeledger_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 静态资源可交给浏览器长期缓存（文件名带 hash）
    location /assets/ {
        proxy_pass http://homeledger_api;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
